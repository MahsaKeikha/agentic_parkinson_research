name: SAFE-GAIT Scientific Integrity Checks

on:
  push:
    paths:
      - 'SAFE-GAIT/**'
      - '.github/workflows/safe-gait-scientific-integrity.yml'
  pull_request:
    paths:
      - 'SAFE-GAIT/**'
      - '.github/workflows/safe-gait-scientific-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scientific-integrity:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Test causal event matching and fail-closed readiness
        run: python -m pytest -q SAFE-GAIT/tests/test_event_audit_reference.py SAFE-GAIT/tests/test_scientific_readiness_gate.py
      - name: Confirm absent evidence is blocked
        shell: bash
        run: |
          printf '{"evidence": {}}\n' > /tmp/safe-gait-no-evidence.json
          set +e
          python SAFE-GAIT/tools/scientific_readiness_gate.py /tmp/safe-gait-no-evidence.json > /tmp/readiness.json
          status=$?
          set -e
          test "$status" -eq 2
          python -c "import json; x=json.load(open('/tmp/readiness.json')); assert x['status']=='BLOCKED'"
      - name: Explain CI scope
        run: |
          echo 'CI verifies code behavior on synthetic fixtures only.'
          echo 'No full FoG-STAR v3 experiment or scientific validation is implied.'
