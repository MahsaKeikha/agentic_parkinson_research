name: Gold Standard CI

on: [push, pull_request]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e . pytest ruff
      - name: Lint
        run: ruff check .
      - name: Tests
        run: python -m pytest -q
      - name: Held-out Parkinson research suite
        run: python evals/heldout_suite.py
      - name: Example
        run: python examples/example.py
      - name: Smoke run
        run: python run.py
      - name: Upload held-out results
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: f61-heldout-results
          path: heldout-results.json
