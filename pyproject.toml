[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-parkinson-research"
version = "1.0.0"
description = "Governed multi-agent Parkinson research support reference system"
requires-python = ">=3.10"
license = {text = "MIT"}

[tool.setuptools.packages.find]
where = ["."]
include = ["AGENTS*", "TOOLS*", "SKILLS*", "orchestration*", "memory*", "state*", "schemas*", "config*", "safety*", "observability*", "evals*"]
namespaces = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E9", "F"]
